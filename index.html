<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Control</title>
    <link rel="stylesheet" href="CSS/style.css">

</head>
<body>
    <main id="tasks-container">
        <div id="task-questions">
            <h2>Salve a sua próxima tarefa:</h2>
            <form action="" autocomplete="on">
                <input type="text" name="qst" id="task-title" autocomplete="on" placeholder="Ex: Mandar mensagem para o cliente.">
                <button id="add-btn" type="submit">
                    <ion-icon name="add-outline"></ion-icon>
                </button>
            </form>
        </div>
        <div id="tasks-list-container">
            <h2>Estas são as suas tarefas:</h2>
            <ul id="task-list">
                <li class="task-box template hide">
                    <span class="task-title"></span>
                    <ion-icon name="checkmark-outline" class="done-btn"></ion-icon>
                    <ion-icon name="close-outline" class="remove-btn"></ion-icon>
                </li>
            </ul>
        </div>
    </main>
    <script src="Js/script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@5.1.2/dist/ionicons/ionicons.esm.js"></script>
</body>
</html>
